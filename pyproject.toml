[project]
name = "devpilot-infra"
version = "0.1.0"
description = "Multi-agent software engineering optimization infrastructure built on AgentTeams"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "redis>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
