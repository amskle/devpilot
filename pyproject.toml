[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot-infra"
version = "0.2.0"
description = "LangGraph-based agent engineering runtime for safe software changes"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2.0,<1.3",
  "langgraph-checkpoint-sqlite>=3.1.0,<3.2",
  "openai>=3.3.0,<4",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "setuptools==84.0.0",
]
legacy-mcp = [
  "mcp>=1.26,<2",
]

[project.scripts]
devpilot = "devpilot.cli:main"

[tool.setuptools.packages.find]
include = ["devpilot*", "runtime*", "shared_state*", "skills*"]
exclude = ["demo*", "tests*", "agentteams*", "out*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
